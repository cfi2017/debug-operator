apiVersion: v1
kind: ServiceAccount
metadata:
  name: debug-bootstrap-writer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: debug-bootstrap-writer
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debug-bootstrap-writer
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: debug-bootstrap-writer
subjects:
  - kind: ServiceAccount
    name: debug-bootstrap-writer
    namespace: default
