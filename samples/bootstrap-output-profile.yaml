apiVersion: debug.hadron.re/v1alpha1
kind: DebugProfile
metadata:
  name: bootstrap-output
  namespace: default
spec:
  selector:
    namespaceOptIn:
      debug-operator.hadron.re/enabled: "true"
    podLabels:
      app: target
  bootstrap:
    image: python:3.13-alpine
    pythonDependencies:
      - requests==2.32.5
    source: |
      import os
      import requests

      output = os.environ["BOOTSTRAP_OUTPUT_DIRECTORY"]
      path = os.path.join(output, "configmaps", "debug-bootstrap-output")
      os.makedirs(path, exist_ok=True)
      with open(os.path.join(path, "message"), "w") as file:
          file.write("hello-from-bootstrap")
    outputConfigMaps:
      - debug-bootstrap-output
    optional: true
  injection:
    env:
      - name: DEBUG_BOOTSTRAP_MESSAGE
        valueFrom:
          configMapKeyRef:
            name: debug-bootstrap-output
            key: message
            optional: true
    volumes:
      - name: debug-bootstrap-output
        configMap:
          name: debug-bootstrap-output
          optional: true
    volumeMounts:
      - name: debug-bootstrap-output
        mountPath: /debug/bootstrap
        readOnly: true
