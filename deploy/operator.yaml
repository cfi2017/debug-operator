apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-operator
  namespace: debug-operator-system
  labels:
    app.kubernetes.io/name: debug-operator
    app.kubernetes.io/managed-by: debug-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: debug-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: debug-operator
        app.kubernetes.io/managed-by: debug-operator
    spec:
      serviceAccountName: debug-operator
      containers:
        - name: operator
          image: ghcr.io/cfi2017/debug-operator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RUST_LOG
              value: info,debug_operator=debug
            - name: LISTEN_ADDR
              value: 0.0.0.0:8443
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: debug-operator-tls
---
apiVersion: v1
kind: Service
metadata:
  name: debug-operator-webhook
  namespace: debug-operator-system
spec:
  selector:
    app.kubernetes.io/name: debug-operator
  ports:
    - name: https
      port: 443
      targetPort: https
