replicaCount: 1

image:
  repository: ghcr.io/cfi2017/debug-operator
  # Defaults to the chart's appVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

logLevel: info,debug_operator=debug
listenAddr: 0.0.0.0:8443

service:
  port: 443
  targetPort: 8443

tls:
  secretName: debug-operator-tls
  certMountPath: /tls
  certFile: tls.crt
  keyFile: tls.key

certManager:
  enabled: true
  issuerName: ""
  certificateName: ""

webhook:
  create: true
  name: debug-operator-pods
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  namespaceSelector:
    matchLabels:
      debug-operator.hadron.re/enabled: "true"
  caBundle: ""
