apiVersion: v1
kind: Service
metadata:
  name: {{ include "debug-operator.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "debug-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "debug-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
