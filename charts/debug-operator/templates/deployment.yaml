apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "debug-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "debug-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "debug-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "debug-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/managed-by: debug-operator
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "debug-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: LISTEN_ADDR
              value: {{ .Values.listenAddr | quote }}
            - name: TLS_CERT_FILE
              value: {{ printf "%s/%s" .Values.tls.certMountPath .Values.tls.certFile | quote }}
            - name: TLS_KEY_FILE
              value: {{ printf "%s/%s" .Values.tls.certMountPath .Values.tls.keyFile | quote }}
          ports:
            - name: https
              containerPort: {{ .Values.service.targetPort }}
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - name: tls
              mountPath: {{ .Values.tls.certMountPath }}
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
