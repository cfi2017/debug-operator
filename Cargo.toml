[package]
name = "debug-operator"
version = "1.0.2"
edition = "2024"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
anyhow = "1.0"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
futures = "0.3"
json-patch = "4.0"
jsonptr = "0.7"
k8s-openapi = { version = "0.28", features = ["v1_34", "schemars"] }
kube = { version = "4.2", default-features = false, features = ["client", "derive", "runtime", "admission", "jsonpatch", "ring", "rustls-tls"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
