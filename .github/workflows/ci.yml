name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test

      - name: Check all targets
        run: cargo check --all-targets

  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/debug-operator

      - name: Render chart
        run: helm template debug-operator charts/debug-operator --namespace debug-operator-system --include-crds >/tmp/debug-operator-chart.yaml

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/cfi2017/debug-operator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
